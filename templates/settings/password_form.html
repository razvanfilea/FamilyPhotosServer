{# The change-password form. HTMX posts it (`/ui/settings/password`); the answer is this form again, empty (200), or with the reason (422), when only the error line is swapped so the typed passwords stay #}
<form class="fp-settings-card fp-password-form" data-slot="password-form" data-testid="password-form" novalidate
              hx-post="/ui/settings/password" hx-disable="find button[type=submit]"
              hx-status:422="swap:outerHTML target:#password-error select:#password-error">
            <h3 class="fp-password-form__title">Change password</h3>
            <label class="fp-field">
                <span class="fp-field__label">Current password</span>
                <input type="password" name="current_password" class="input" autocomplete="current-password" required
                       data-testid="password-current">
            </label>
            <label class="fp-field">
                <span class="fp-field__label">New password</span>
                <input type="password" name="new_password" class="input" autocomplete="new-password" minlength="8" required
                       data-testid="password-new">
            </label>
            <label class="fp-field">
                <span class="fp-field__label">Confirm new password</span>
                <input type="password" name="confirm_password" class="input" autocomplete="new-password" required
                       data-testid="password-confirm">
            </label>
            <p id="password-error" class="fp-field__error" role="alert" data-slot="password-error" data-field="{{ field }}" data-testid="password-error"
               {%- if error.is_none() %} hidden{% endif %}>{% if let Some(error) = error %}{{ error }}{% endif %}</p>
            <div>
                <button type="submit" class="btn btn-primary" data-testid="password-submit">Change password</button>
            </div>
        </form>
