{% import "macros/icons.html" as icons %}

{# THE photo tile, used by every grid. `photo` is a `crate::http::views::PhotoTileView`. #}
{# `badge_kind` is "" or "error" (red) #}
{% macro photo_tile(photo, index, badge="", badge_kind="") -%}
<button type="button"
        class="photo-tile"
        data-photo-id="{{ photo.id }}"
        data-index="{{ index }}"
        data-video="{{ photo.is_video }}"
        data-deletable="{{ photo.deletable }}"
        data-owner="{{ photo.owner }}"
        data-testid="photo-tile"
        aria-label="{{ photo.aria_label }}"
        style="view-transition-name: none">
    <canvas class="photo-tile__hash" data-thumbhash="{{ photo.thumb_hash_b64 }}" aria-hidden="true"></canvas>
    <img class="photo-tile__img" src="/api/preview/{{ photo.id }}" loading="lazy" decoding="async" alt="">
    {%- if photo.is_video %}<span class="photo-tile__video">{% call icons::icon("play_circle", true) %}{% endcall %}</span>{% endif %}
    <span class="photo-tile__check" aria-hidden="true">{% call icons::icon("radio_button_unchecked") %}{% endcall %}{% call icons::icon("check_circle", true) %}{% endcall %}</span>
    {%- if badge != "" %}<span class="photo-tile__badge{% if badge_kind != "" %} photo-tile__badge--{{ badge_kind }}{% endif %}">{{ badge }}</span>{% endif %}
</button>
{%- endmacro %}
