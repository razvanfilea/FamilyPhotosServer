{% import "macros/icons.html" as icons %}
<!DOCTYPE html>
<html lang="en" data-theme="familyphotos">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Family Photos">
    <meta name="theme-color" content="#1A1C19">
    <meta name="color-scheme" content="dark">
    <meta name="htmx-config"
          content='{"defaultSwapStyle":"outerHTML","globalViewTransitions":false,"scrollIntoViewOnBoost":false,"historyCacheSize":0,"allowEval":false,"includeIndicatorStyles":false}'>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/fav/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/fav/apple-touch-icon.png">
    <link rel="manifest" href="/assets/manifest.webmanifest">

    <link rel="stylesheet" href="/assets/css/main.css?v={{ crate::http::AppState::ASSET_VERSION }}">
    <script src="/assets/vendor/htmx.min.js?v={{ crate::http::AppState::ASSET_VERSION }}" defer></script>
    <script type="module" src="/assets/js/app.js"></script>
    {%- block head %}{% endblock %}

    <title>{% block title %}Family Photos{% endblock %}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}

<div id="toasts" class="toast toast-center toast-bottom" role="status" aria-live="polite"
     data-testid="toasts"></div>

<dialog id="app-dialog" class="modal modal-bottom sm:modal-middle" aria-labelledby="app-dialog-title"
        data-testid="app-dialog">
    <div id="app-dialog-content" class="modal-box"></div>
    <form method="dialog" class="modal-backdrop">
        <button type="submit" tabindex="-1">Close</button>
    </form>
</dialog>

<template id="confirm-dialog-template">
    <h2 id="app-dialog-title" class="text-lg font-semibold" data-slot="title"></h2>
    <div class="py-4 text-base-content/80" data-slot="body"></div>
    <div class="modal-action">
        <button type="button" class="btn btn-ghost" data-slot="cancel" data-testid="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" data-slot="confirm" data-testid="confirm-accept">OK</button>
    </div>
</template>

<template id="toast-template">
    <div class="fp-toast" data-testid="toast">
        <span class="fp-toast__message" data-slot="message"></span>
        <button type="button" class="btn btn-sm btn-ghost fp-toast__action" data-slot="action" hidden></button>
        <button type="button" class="btn btn-sm btn-ghost btn-square fp-toast__close" data-slot="close"
                aria-label="Dismiss">{% call icons::icon("close") %}{% endcall %}</button>
    </div>
</template>

<script type="application/json" id="app-strings">
{"networkError":"Failed to connect to server","genericError":"Something went wrong"}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
