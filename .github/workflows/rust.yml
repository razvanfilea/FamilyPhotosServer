name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:/tmp/ci-test.db?mode=rwc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Setup test database
        run: |
          sqlx database create
          sqlx migrate run
      - run: cargo test --all-features

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the harness to create databases) needs Node 22.13+
          node-version: 24
      - name: Install ImageMagick and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      # Ubuntu's ImageMagick 6 has no `magick` binary
      - name: Provide the magick command
        run: command -v magick || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
      - run: npm install
      - run: npx playwright install-deps chromium
      - run: npm run prod
      - run: npm run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright/playwright-report
